name: Build LiveKit addon (APM)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
            arch: ""
          - os: windows-2025
            platform: windows
            arch: ""
          - os: ubuntu-22.04
            platform: android
            arch: arm64
    steps:
      - name: Checkout Godot-LiveKit main with APM
        uses: actions/checkout@v4
        with:
          repository: NodotProject/godot-livekit
          ref: ae0946a8752a17664408f697a925c24427a0801b
          submodules: recursive
          path: upstream

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxfixes-dev libxinerama-dev libwayland-dev libpipewire-0.3-dev libsystemd-dev

      - name: Set up Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Export Android NDK path
        if: matrix.platform == 'android'
        shell: bash
        run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"

      - name: Build extension
        shell: bash
        working-directory: upstream
        run: |
          set -o pipefail
          ./build.sh "${{ matrix.platform }}" ${{ matrix.arch }} 2>&1 | tee build-log.txt

      - name: Upload addon
        uses: actions/upload-artifact@v4
        with:
          name: livekit-addon-${{ matrix.platform }}-${{ matrix.arch || 'x86_64' }}
          path: upstream/addons/godot-livekit
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livekit-build-log-${{ matrix.platform }}-${{ matrix.arch || 'x86_64' }}
          path: upstream/build-log.txt
          if-no-files-found: ignore
          retention-days: 7
