name: Opening clock diagnostic
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  opening-clock:
    name: Graphical opening clock ${{ matrix.attempt }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install original engine and graphical dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb libpipewire-0.3-0t64
          for attempt in 1 2 3 4 5; do
            if gh release download 4.7.2-stable --repo godotengine/godot --pattern Godot_v4.7.2-stable_linux.x86_64.zip --output /tmp/godot.zip --clobber; then break; fi
            test "$attempt" -lt 5
            sleep 3
          done
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
      - name: Import isolated project
        run: |
          set -euo pipefail
          mkdir -p build/trace
          git rev-parse HEAD > build/trace/source.txt
          rm -rf addons/godot-livekit
          godot --headless --path . --editor --import > build/trace/import.log 2>&1
          sed -i 's/^driver\/enable_input=true/driver\/enable_input=false/' project.godot
      - name: Run original dedicated room and graphical opening clock
        run: |
          set -euo pipefail
          xvfb-run -a python -X utf8 tests/run_opening_clock_trace.py . "$(command -v godot)" 2>&1 | tee build/trace/integration.log
      - name: Preserve paired state transitions
        if: always()
        run: |
          mkdir -p build/trace
          python - <<'PY'
          from pathlib import Path
          dest = Path("build/trace")
          for label, sources in [("authority", list(Path("build/room-server").glob("*.log"))), ("client", [Path("build/online_opening_clock.log"), Path("build/online_opening_clock.err")])]:
              out = []
              for src in sources:
                  if src.is_file():
                      out.extend(line for line in src.read_text(errors="replace").splitlines() if any(tag in line for tag in ["[clk-", "[opening-clock]", "[online_opening_clock]", "[FAIL]", "[PASS]", "SCRIPT ERROR", "ERROR:", "at: GDScript", "GL API", "llvmpipe"]))
              (dest / (label + ".log")).write_text("\n".join(out) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opening-clock-${{ matrix.attempt }}-${{ github.run_id }}
          path: |
            build/trace/
            build/opening-clock/after.png
          if-no-files-found: error
          retention-days: 7
