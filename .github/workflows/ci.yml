name: Pull request and push checks

on:
  push:
    branches:
      - main
      - master
      - "remake/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  remake-checks:
    name: Remake game and server checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Godot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if gh release download "$GODOT_RELEASE" --repo godotengine/godot --pattern "Godot_v${GODOT_RELEASE}_linux.x86_64.zip" --output /tmp/godot.zip --clobber; then break; fi
            test "$attempt" -lt 5
            sleep 3
          done
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot

      - name: Install Godot Linux runtime dependency
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-0t64

      - name: Import project
        shell: bash
        run: godot --headless --path remake/game --editor --import

      - name: Run game checks
        shell: bash
        run: python -X utf8 remake/game/tools/run_checks.py --godot "$(command -v godot)" --timeout 300

      - name: Run room directory and record storage checks
        shell: bash
        run: |
          python -X utf8 remake/server/test_room_directory.py --godot "$(command -v godot)"
          python -X utf8 remake/server/test_record_store.py --godot "$(command -v godot)"
          python -X utf8 remake/server/test_portal_api.py --godot "$(command -v godot)"
          python -X utf8 remake/tools/test_prepare_hot_patch.py

      - name: Upload game check logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: remake-check-logs-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: build/remake-acceptance/
