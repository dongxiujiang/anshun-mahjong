name: Build release

on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: "构建完整包或基于固定基线的热补丁"
        required: true
        default: full
        type: choice
        options:
          - full
          - patch
      baseline_run_id:
        description: "patch 模式填写保存 baseline artifact 的完整构建 run id"
        required: false
        type: string
      baseline_source:
        description: "patch 基线来源：V1.0.0 Release 附件或 Actions artifact"
        required: true
        default: release
        type: choice
        options:
          - release
          - artifact
      baseline_release_tag:
        description: "release 基线标签，现有玩家填写 V1.0.0"
        required: false
        default: V1.0.0
        type: string
      patch_version:
        description: "patch 模式版本号，例如 1.0.1"
        required: false
        type: string
      publish_release:
        description: "构建成功后自动创建 GitHub Release 并上传附件"
        required: true
        default: false
        type: boolean
      release_notes:
        description: "Release 说明；留空使用默认说明"
        required: false
        type: string
  push:
    tags:
      - "V1.0.*"

permissions:
  contents: write
  actions: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "4.7.2-stable"
  BASELINE_ID: "1.0.0-boot1"

jobs:
  build:
    name: Build Windows and Android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_KIND: ${{ inputs.release_kind || 'full' }}
      BASELINE_RUN_ID: ${{ inputs.baseline_run_id || '' }}
      BASELINE_SOURCE: ${{ inputs.baseline_source || 'release' }}
      BASELINE_RELEASE_TAG: ${{ inputs.baseline_release_tag || 'V1.0.0' }}
      PATCH_VERSION: ${{ inputs.patch_version || '' }}
      PUBLISH_RELEASE: ${{ inputs.publish_release || false }}
      RELEASE_NOTES: ${{ inputs.release_notes || 'GitHub Actions 自动生成的构建' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy LiveKit addon
        shell: bash
        run: rm -rf addons/godot-livekit

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate release inputs
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from tools.update.prepare_hot_update import release_tag, setting
          kind = os.environ["RELEASE_KIND"]
          if kind not in {"full", "patch"}:
              raise SystemExit("release_kind 必须是 full 或 patch")
          source = os.environ["BASELINE_SOURCE"]
          if source not in {"release", "artifact"}:
              raise SystemExit("baseline_source 必须是 release 或 artifact")
          base = setting("base_id")
          if not re.fullmatch(r"[A-Za-z0-9_.-]+", base):
              raise SystemExit("base_id 含有不安全字符")
          if kind == "patch":
              if source == "artifact" and not re.fullmatch(r"[0-9]+", os.environ["BASELINE_RUN_ID"]):
                  raise SystemExit("artifact 基线必须填写数字形式的 baseline_run_id")
              if source == "release" and not re.fullmatch(r"V[0-9]+\.[0-9]+\.[0-9]+", os.environ["BASELINE_RELEASE_TAG"]):
                  raise SystemExit("release 基线标签必须是 Vx.y.z")
              if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", os.environ["PATCH_VERSION"]):
                  raise SystemExit("patch_version 必须是 x.y.z")
          version = setting("config/version") if kind == "full" else os.environ["PATCH_VERSION"]
          if os.environ.get("PUBLISH_RELEASE", "false").lower() not in {"true", "false"}:
              raise SystemExit("publish_release 必须是布尔值")
          if os.environ.get("GITHUB_EVENT_NAME") == "push":
              tag = os.environ.get("GITHUB_REF_NAME", "")
              expected = release_tag(setting("config/version"))
              if tag != expected:
                  raise SystemExit(f"标签 {tag} 与工程版本不一致，应为 {expected}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"BASELINE_ID={base}\nRELEASE_VERSION={version}\n")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install -m 0755 "/tmp/godot/Godot_v${GODOT_RELEASE}_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_export_templates.tpz"
          rm -rf /tmp/templates
          mkdir -p /tmp/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          test -f /tmp/templates/templates/windows_release_x86_64.exe
          test -f /tmp/templates/templates/android_release.apk
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Install LiveKit Linux runtime dependency
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-0t64

      - name: Configure Godot Android export
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          GODOT_VERSION: ${{ env.GODOT_VERSION }}
        run: python tools/release/configure_ci_export.py

      - name: Import project and run CI configuration tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci
          godot --headless --path . --editor --import > build/ci/import.log 2>&1
          python -m unittest discover -s tests -p 'test_ci_export.py' 2>&1 | tee build/ci/configure_tests.log

      - name: Run core tests
        if: false
        shell: bash
        env:
          AI_ROUNDS: "50"
          AI_MIN_ROUNDS: "50"
        run: |
          set -euo pipefail
          # Headless Linux has no microphone device. Keep input enabled for the
          # exported client, but disable it while running the headless suites.
          sed -i 's/^driver\/enable_input=true/driver\/enable_input=false/' project.godot
          # 不指定 --suite，自动执行 tests/run_all.gd 注册的完整回归清单。
          python -X utf8 tests/run_suites.py --godot "$(command -v godot)" \
            --simulation-timeout 600

      - name: Run real network and reconnect regression
        if: false
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 tests/run_network.py --godot "$(command -v godot)" --section all
          python -X utf8 tests/run_reconnect.py --godot "$(command -v godot)"

      - name: Restore client audio input before export
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^driver\/enable_input=false/driver\/enable_input=true/' project.godot

      - name: Configure Android signing
        if: ${{ env.RELEASE_KIND == 'full' }}
        shell: bash
        env:
          GITHUB_ACTIONS: "true"
          GODOT_VERSION: ${{ env.GODOT_VERSION }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
        run: python tools/release/configure_ci_export.py --signing

      - name: Install Android Gradle build template
        if: ${{ env.RELEASE_KIND == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          test -f "$TEMPLATES/android_source.zip"
          rm -rf /tmp/godot-android-template android
          mkdir -p /tmp/godot-android-template android/build
          unzip -q "$TEMPLATES/android_source.zip" -d /tmp/godot-android-template
          SRC=/tmp/godot-android-template
          if [ -d "$SRC/android_source" ]; then SRC="$SRC/android_source"; fi
          cp -a "$SRC"/. android/build/
          printf "4.7.2.stable" > android/build/.build_version
          test -f android/build/build.gradle

      - name: Export full Windows and Android packages
        if: ${{ env.RELEASE_KIND == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/windows build/android
          godot --headless --path . --export-release "Windows" build/windows/anshun-mahjong-windows-x64.exe > build/ci/windows-export.log 2>&1 || { cat build/ci/windows-export.log; exit 1; }
          godot --headless --path . --export-release "Android" build/android/anshun-mahjong.apk > build/ci/android-export.log 2>&1 || { cat build/ci/android-export.log; exit 1; }
          test -s build/windows/anshun-mahjong-windows-x64.exe
          test -s build/android/anshun-mahjong.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose build/android/anshun-mahjong.apk

      - name: Prepare full manifest and baseline
        if: ${{ env.RELEASE_KIND == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/update/prepare_release.py \
            --windows build/windows/anshun-mahjong-windows-x64.exe \
            --android build/android/anshun-mahjong.apk \
            --output build/releases \
            --repository "$GITHUB_REPOSITORY"
          python tools/update/prepare_hot_update.py baseline \
            --godot "$(command -v godot)" \
            --output "build/update_baselines/$BASELINE_ID"

      - name: Upload full release artifact
        if: ${{ env.RELEASE_KIND == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: full-release-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            build/releases/**
            build/windows/anshun-mahjong-windows-x64.exe
            build/android/anshun-mahjong.apk

      - name: Upload patch baseline artifact
        if: ${{ env.RELEASE_KIND == 'full' }}
        uses: actions/upload-artifact@v4
        with:
          name: baseline
          retention-days: 90
          if-no-files-found: error
          path: |
            build/update_baselines/${{ env.BASELINE_ID }}/baseline.json
            build/update_baselines/${{ env.BASELINE_ID }}/windows-base.pck
            build/update_baselines/${{ env.BASELINE_ID }}/android-base.pck

      - name: Download selected baseline
        if: ${{ env.RELEASE_KIND == 'patch' && env.BASELINE_SOURCE == 'artifact' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.BASELINE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: baseline
          path: build/update_baselines/${{ env.BASELINE_ID }}

      - name: Download original release baseline
        if: ${{ env.RELEASE_KIND == 'patch' && env.BASELINE_SOURCE == 'release' }}
        shell: bash
        run: |
          set -euo pipefail
          folder="build/update_baselines/$BASELINE_ID"
          mkdir -p "$folder"
          for file in baseline.json windows-base.pck android-base.pck; do
            curl --fail --location --retry 3 \
              "https://github.com/$GITHUB_REPOSITORY/releases/download/$BASELINE_RELEASE_TAG/$file" \
              --output "$folder/$file"
          done
          test -s "$folder/baseline.json"
          test -s "$folder/windows-base.pck"
          test -s "$folder/android-base.pck"

      - name: Generate hot-update patches
        if: ${{ env.RELEASE_KIND == 'patch' }}
        shell: bash
        env:
          PATCH_VERSION: ${{ env.PATCH_VERSION }}
        run: |
          set -euo pipefail
          python tools/update/prepare_hot_update.py patch \
            --godot "$(command -v godot)" \
            --baseline "build/update_baselines/$BASELINE_ID" \
            --version "$PATCH_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --output build/releases \
            --notes "GitHub Actions 自动生成的小版本补丁"

      - name: Upload patch artifact
        if: ${{ env.RELEASE_KIND == 'patch' }}
        uses: actions/upload-artifact@v4
        with:
          name: patch-release-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: build/releases/**

      - name: Write release notes
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        shell: bash
        env:
          RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          Path("build/ci/release-notes.md").write_text(os.environ["RELEASE_NOTES"] + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        if: ${{ env.PUBLISH_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: V${{ env.RELEASE_VERSION }}
          name: 安顺麻将 V${{ env.RELEASE_VERSION }}
          body_path: build/ci/release-notes.md
          draft: false
          prerelease: false
          files: build/releases/v${{ env.RELEASE_VERSION }}/*

      - name: Upload safe CI logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            build/ci/import.log
            build/ci/configure_tests.log
            build/test_results/**

      - name: Remove temporary signing files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/signing/release.keystore" .godot/export_credentials.cfg
