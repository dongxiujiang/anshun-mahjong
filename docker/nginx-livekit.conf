# Add this location inside the mj.dongxiu.fun server block, before location /.
# The client connects to wss://mj.dongxiu.fun/livekit; proxy_pass strips the
# /livekit/ prefix so LiveKit receives /rtc and /twirp on port 7880.
location /livekit/ {
    proxy_pass http://127.0.0.1:7880/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}
