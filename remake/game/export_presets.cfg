[preset.0]
name="Android Internal QA"
platform="Android"
runnable=true
dedicated_server=false
export_filter="all_resources"
include_filter="assets/layouts/*.json"
exclude_filter="src/app/test_*.gd,assets/tiles/classic/tiles.glb,assets/tiles/classic/tiles_mahJong*.png,assets/characters/roster-approved.png,assets/characters/provenance.json,tests/*,tools/*,build/*"
export_path=""

[preset.0.options]
gradle_build/use_gradle_build=true
gradle_build/compress_native_libraries=true
gradle_build/export_format=0
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=true
version/code=12
version/name="2.4.5"
package/unique_name="com.anshun.mahjong.remake.qa"
package/name="东秀麻将"
package/signed=true
permissions/internet=true
permissions/record_audio=true
permissions/access_network_state=true
permissions/modify_audio_settings=true
permissions/wake_lock=true
permissions/custom_permissions=PackedStringArray()
launcher_icons/main_192x192="res://src/app/assets/android_icon.png"
launcher_icons/adaptive_foreground_432x432="res://src/app/assets/android_foreground.png"
launcher_icons/adaptive_background_432x432="res://src/app/assets/android_background.png"


keystore/debug="../../.local/signing/local-qa.keystore"
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"

